<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepr - Logs: {{.Name}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            position: sticky;
            top: 0;
            background: #16213e;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #0f3460;
            z-index: 100;
        }
        .back-link {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .server-name {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .status-idle { background: #95a5a6; }
        .status-running {
            background: #f39c12;
            animation: pulse 1.5s infinite;
        }
        .status-success { background: #27ae60; }
        .status-failed_pre_hook,
        .status-failed_backup,
        .status-failed_post_hook { background: #e74c3c; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .log-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
        }
        .log-line {
            font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Code", monospace;
            font-size: 13px;
            line-height: 1.6;
            padding: 2px 8px;
            border-radius: 3px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-line:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .connection-status {
            font-size: 12px;
            color: #666;
            margin-left: auto;
        }
        .connection-status.connected {
            color: #27ae60;
        }
        .connection-status.disconnected {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back-link">← Dashboard</a>
        <div class="server-name">
            <span class="status-dot status-{{.Status}}"></span>
            {{.Name}}
        </div>
        <span id="connection-status" class="connection-status">Connecting...</span>
    </div>

    <div class="log-container" id="log-container">
        {{range .Logs}}
        <div class="log-line">{{.}}</div>
        {{end}}
    </div>

    <script>
        const logContainer = document.getElementById('log-container');
        const connectionStatus = document.getElementById('connection-status');
        let eventSource = null;

        function scrollToBottom() {
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function appendLog(line) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.textContent = line;
            logContainer.appendChild(div);
            scrollToBottom();
        }

        function connect() {
            eventSource = new EventSource('/api/logs/{{.Name}}/stream');

            eventSource.onopen = function() {
                connectionStatus.textContent = 'Connected';
                connectionStatus.className = 'connection-status connected';
            };

            eventSource.onmessage = function(event) {
                appendLog(event.data);
            };

            eventSource.onerror = function() {
                connectionStatus.textContent = 'Disconnected - Reconnecting...';
                connectionStatus.className = 'connection-status disconnected';
                eventSource.close();
                setTimeout(connect, 5000);
            };
        }

        // Initial scroll to bottom
        scrollToBottom();

        // Connect to SSE stream
        connect();
    </script>
</body>
</html>
