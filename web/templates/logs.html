<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepr - Logs: {{.Name}}</title>
    <script>
        (function() {
            var theme = localStorage.getItem('keepr-theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-header: #34495e;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-header: #ffffff;
            --border-color: #dddddd;
            --hover-bg: rgba(0, 0, 0, 0.03);
            --link-color: #3498db;
            --log-font-color: #1a1a1a;
        }
        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-header: #16213e;
            --text-primary: #eeeeee;
            --text-secondary: #aaaaaa;
            --text-header: #eeeeee;
            --border-color: #0f3460;
            --hover-bg: rgba(255, 255, 255, 0.05);
            --link-color: #5dade2;
            --log-font-color: #eeeeee;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            position: sticky;
            top: 0;
            background: var(--bg-header);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .back-link {
            color: var(--link-color);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .server-name {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-header);
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .status-idle { background: #95a5a6; }
        .status-running {
            background: #f39c12;
            animation: pulse 1.5s infinite;
        }
        .status-success { background: #27ae60; }
        .status-failed_pre_hook,
        .status-failed_backup,
        .status-failed_post_hook { background: #e74c3c; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-left: auto;
        }
        .theme-toggle input {
            display: none;
        }
        .theme-toggle label {
            width: 40px;
            height: 22px;
            background: var(--bg-primary);
            border-radius: 11px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        .theme-toggle label::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            background: var(--bg-header);
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .theme-toggle input:checked + label::after {
            transform: translateX(18px);
        }
        .theme-icon {
            font-size: 14px;
        }

        .connection-status {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .connection-status.connected {
            color: #27ae60;
        }
        .connection-status.disconnected {
            color: #e74c3c;
        }

        .log-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: var(--bg-secondary);
        }
        .log-line {
            font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Code", monospace;
            font-size: 13px;
            line-height: 1.6;
            padding: 2px 8px;
            border-radius: 3px;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--log-font-color);
        }
        .log-line:hover {
            background: var(--hover-bg);
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back-link">← Dashboard</a>
        <div class="server-name">
            <span class="status-dot status-{{.Status}}"></span>
            {{.Name}}
        </div>
        <div class="theme-toggle">
            <span class="theme-icon">☀️</span>
            <input type="checkbox" id="theme-switch">
            <label for="theme-switch"></label>
            <span class="theme-icon">🌙</span>
        </div>
        <span id="connection-status" class="connection-status">Connecting...</span>
    </div>

    <div class="log-container" id="log-container">
        {{range .Logs}}
        <div class="log-line">{{.}}</div>
        {{end}}
    </div>

    <script>
        const logContainer = document.getElementById('log-container');
        const connectionStatus = document.getElementById('connection-status');
        let eventSource = null;

        function scrollToBottom() {
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function appendLog(line) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.textContent = line;
            logContainer.appendChild(div);
            scrollToBottom();
        }

        function connect() {
            eventSource = new EventSource('/api/logs/{{.Name}}/stream');

            eventSource.onopen = function() {
                connectionStatus.textContent = 'Connected';
                connectionStatus.className = 'connection-status connected';
            };

            eventSource.onmessage = function(event) {
                appendLog(event.data);
            };

            eventSource.onerror = function() {
                connectionStatus.textContent = 'Disconnected - Reconnecting...';
                connectionStatus.className = 'connection-status disconnected';
                eventSource.close();
                setTimeout(connect, 5000);
            };
        }

        // Theme toggle
        (function() {
            var themeSwitch = document.getElementById('theme-switch');
            var storedTheme = localStorage.getItem('keepr-theme');
            var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = storedTheme === 'dark' || (!storedTheme && systemDark);

            themeSwitch.checked = isDark;

            themeSwitch.addEventListener('change', function() {
                if (this.checked) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('keepr-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('keepr-theme', 'light');
                }
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('keepr-theme')) {
                    if (e.matches) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        themeSwitch.checked = true;
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                        themeSwitch.checked = false;
                    }
                }
            });
        })();

        // Initial scroll to bottom
        scrollToBottom();

        // Connect to SSE stream
        connect();
    </script>
</body>
</html>
